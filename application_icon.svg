<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 459" width="532" height="459">
  <defs>
    <!-- 金色金属渐变边框 -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BC94" />
      <stop offset="30%" stop-color="#F2DFB9" />
      <stop offset="55%" stop-color="#B09367" />
      <stop offset="80%" stop-color="#E5CFA7" />
      <stop offset="100%" stop-color="#9A7E54" />
    </linearGradient>

    <!-- 深炭黑主填充渐变 -->
    <linearGradient id="darkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222328" />
      <stop offset="50%" stop-color="#1D1E22" />
      <stop offset="100%" stop-color="#25262B" />
    </linearGradient>

    <style>
      .gold-frame {
        fill: url(#goldBorder);
        stroke: #2A2520;
        stroke-width: 1.5;
        stroke-linejoin: miter;
        stroke-miterlimit: 10;
      }
      .inner-dark {
        fill: url(#darkFill);
        stroke: #4A3E2D;
        stroke-width: 0.8;
      }
    </style>
  </defs>

